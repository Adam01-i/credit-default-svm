<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline Credit Default SVM</title>
  <desc id="desc">Chargement, préparation, entraînement, évaluation et prédiction.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#102a43"/><stop offset="1" stop-color="#1f4e5f"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8fd3c7"/></marker></defs>
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/><text x="60" y="52" fill="#f7fbfc" font-family="sans-serif" font-size="25" font-weight="700">Credit Default SVM</text><text x="60" y="80" fill="#b9d7d9" font-family="sans-serif" font-size="15">Un pipeline reproductible, de la donnée brute à la prédiction</text>
  <g font-family="sans-serif" text-anchor="middle"><g transform="translate(60 125)"><rect width="180" height="70" rx="10" fill="#f7fbfc"/><text x="90" y="30" fill="#102a43" font-size="15" font-weight="700">Données</text><text x="90" y="52" fill="#41616b" font-size="13">CSV UCI / exemple</text></g><g transform="translate(285 125)"><rect width="180" height="70" rx="10" fill="#d8f3dc"/><text x="90" y="30" fill="#174b3a" font-size="15" font-weight="700">Préparation</text><text x="90" y="52" fill="#39715b" font-size="13">split + scaling</text></g><g transform="translate(510 125)"><rect width="180" height="70" rx="10" fill="#ffdf9e"/><text x="90" y="30" fill="#633d08" font-size="15" font-weight="700">Entraînement</text><text x="90" y="52" fill="#86601f" font-size="13">SVM + GridSearch</text></g><g transform="translate(735 125)"><rect width="180" height="70" rx="10" fill="#f9c6c9"/><text x="90" y="30" fill="#6e1d28" font-size="15" font-weight="700">Évaluation</text><text x="90" y="52" fill="#8a4049" font-size="13">F1 + confusion</text></g><g transform="translate(960 125)"><rect width="180" height="70" rx="10" fill="#bde0fe"/><text x="90" y="30" fill="#123e63" font-size="15" font-weight="700">Prédiction</text><text x="90" y="52" fill="#376987" font-size="13">nouveaux clients</text></g></g>
  <g stroke="#8fd3c7" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M245 160 H275"/><path d="M470 160 H500"/><path d="M695 160 H725"/><path d="M920 160 H950"/></g>
+</svg>
